<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>WorkFlow - Mot de passe oublié</title>
        <link href="style.css" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>

    <body>
        <main class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1>Mot de passe oublié</h1>
                <p id="step-description">Entrez l'adresse courriel associée à votre compte.</p>
            </div>

            <div class="steps-indicator">
                <span class="done"></span>
                <span></span>
                <span></span>
            </div>

            <div id="reset-message" class="message"></div>

            <!-- Étape 1 : adresse courriel -->
            <form id="step-email" class="step active" novalidate>
                <div class="field">
                    <label for="reset-email">Adresse courriel</label>
                    <input type="email" id="reset-email" placeholder="nom@exemple.com" autocomplete="email">
                    <p class="error" id="reset-email-error"></p>
                </div>
                <button type="submit" class="btn">Envoyer le code</button>
            </form>

            <!-- Étape 2 : code de vérification -->
            <form id="step-code" class="step" novalidate>
                <div class="field">
                    <label for="reset-code">Code de vérification (6 chiffres)</label>
                    <input type="text" id="reset-code" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                    <p class="error" id="reset-code-error"></p>
                </div>
                <button type="submit" class="btn">Vérifier le code</button>
                <p class="auth-footer">
                    Code non reçu ? <button type="button" class="link-btn" id="resend-code">Renvoyer le code</button>
                </p>
            </form>

            <!-- Étape 3 : nouveau mot de passe -->
            <form id="step-password" class="step" novalidate>
                <div class="field">
                    <label for="new-password">Nouveau mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-password" placeholder="Nouveau mot de passe" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="new-password">Afficher</button>
                    </div>
                    <ul class="password-rules" id="new-password-rules">
                        <li data-rule="length">Au moins 8 caractères</li>
                        <li data-rule="upper">Une lettre majuscule</li>
                        <li data-rule="lower">Une lettre minuscule</li>
                        <li data-rule="digit">Un chiffre</li>
                        <li data-rule="special">Un caractère spécial (!@#$%...)</li>
                    </ul>
                    <p class="error" id="new-password-error"></p>
                </div>
                <div class="field">
                    <label for="new-confirm">Confirmer le mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-confirm" placeholder="Confirmer le mot de passe" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="new-confirm">Afficher</button>
                    </div>
                    <p class="error" id="new-confirm-error"></p>
                </div>
                <button type="submit" class="btn">Réinitialiser le mot de passe</button>
            </form>

            <!-- Étape finale : succès -->
            <div id="step-done" class="step">
                <a href="index.html" class="btn" style="display:block; text-align:center; text-decoration:none;">Retour à la connexion</a>
            </div>

            <div class="auth-footer">
                <a href="index.html">← Retour à la connexion</a>
            </div>
        </main>
    </body>
</html>
