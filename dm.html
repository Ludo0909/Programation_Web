<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WorkFlow - Messages Privés</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-service.js"></script>
</head>
<body>
  <!-- Barre latérale globale -->
  <aside class="sidebar-orange">
    <a href="home.html" class="sidebar-brand">
      <div class="brand-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </a>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="home.html" class="nav-item" title="Accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a></li>
        <li><a href="messages.html" class="nav-item" title="Salons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></a></li>
        <li><a href="dm.html" class="nav-item active" title="Messages Privés"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></a></li>
        <li><a href="calendrier.html" class="nav-item" title="Calendrier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a></li>
      </ul>
    </nav>
  </aside>

  <!-- Zone de messagerie directe -->
  <main class="content-chat-layout">
    <!-- Liste des utilisateurs -->
    <section class="chat-sidebar">
      <div class="chat-sidebar-header">
        <h2>Messages Privés</h2>
      </div>
      <div class="chat-search">
        <input type="text" id="search-users" placeholder="Rechercher un membre..." class="form-control">
      </div>
      <div id="users-list" class="chat-list">
        <div class="text-center text-muted small py-4">Chargement des utilisateurs...</div>
      </div>
    </section>

    <!-- Zone de discussion -->
    <section class="chat-main">
      <div id="dm-placeholder" class="chat-placeholder">
        <p>Sélectionnez un membre pour démarrer une discussion privée.</p>
      </div>

      <div id="dm-container" class="chat-container" style="display: none;">
        <header class="chat-header">
          <div class="chat-header-info">
            <div id="dm-avatar" class="avatar">?</div>
            <h3 id="dm-recipient-name">Nom d'utilisateur</h3>
          </div>
        </header>

        <div id="dm-messages" class="chat-messages"></div>

        <form id="dm-form" class="chat-input-area">
          <input type="text" id="dm-input" placeholder="Écrire un message privé..." required autocomplete="off">
          <button type="submit" class="btn-send">Envoyer</button>
        </form>
      </div>
    </section>
  </main>

  <script src="dm.js"></script>
</body>
