<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>WorkFlow - Connexion</title>
        <link href="style.css" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>

    <body>
        <main class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <h1>Connexion à WorkFlow</h1>
                <p>Connectez-vous pour retrouver vos conversations et planifier vos rencontres.</p>
            </div>

            <div id="login-message" class="message"></div>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="login-id">Adresse courriel ou nom d'utilisateur</label>
                    <input type="text" id="login-id" name="login-id" placeholder="nom@exemple.com" autocomplete="username">
                    <p class="error" id="login-id-error"></p>
                </div>

                <div class="field">
                    <label for="login-password">Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" name="login-password" placeholder="Mot de passe" autocomplete="current-password">
                        <button type="button" class="toggle-password" data-target="login-password">Afficher</button>
                    </div>
                    <p class="error" id="login-password-error"></p>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="remember"> Se souvenir de moi
                    </label>
                    <a href="MDP_oublié.html">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn">Se connecter</button>
            </form>

            <div class="auth-footer">
                Pas encore de compte ? <a href="Création_Compte.html">Créer un compte</a>
            </div>
        </main>
    </body>
</html>
