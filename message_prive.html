  <!-- Zone de contenu principale (alignée sur messages.html) -->
  <main class="content">
    <header class="welcome-header">
      <h1>Vos Conversations Privées</h1>
      <p>Échangez en tête-à-tête et en direct avec vos camarades.</p>
    </header>

    <div class="chat-hub-layout">
      <!-- Colonne de gauche (Liste des membres) -->
      <div class="chat-cards-list">
        <div class="chat-list-header">
          <h6 class="mb-2 fw-bold">Contacts</h6>
          <input type="text" id="search-users" class="form-control form-control-sm" placeholder="Rechercher un membre...">
        </div>
        <div id="ul-users" class="chat-list-scroll"></div>
      </div>

      <!-- Colonne de droite (Fenêtre de discussion) -->
      <div class="chat-window-card">
        <!-- Placeholder par défaut -->
        <div id="chat-placeholder">
          <div class="placeholder-icon-wrap">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <h5 class="fw-bold text-dark mb-1">Aucune conversation sélectionnée</h5>
          <p class="small text-muted">Choisissez un membre à gauche pour démarrer un échange privé.</p>
        </div>

        <!-- Conversation active -->
        <div id="chat-container" class="chat-main">
          <div class="chat-header">
            <div class="d-flex align-items-center gap-3">
              <div class="avatar" id="header-avatar">@</div>
              <div>
                <h5 class="mb-0 fw-bold" id="span-user-title">Nom du membre</h5>
                <span class="status-online">● en ligne</span>
              </div>
            </div>
          </div>

          <div id="div-messages" class="messages-area"></div>

          <form id="form-direct-message" class="chat-input-bar">
            <input type="text" id="input-message" placeholder="Écrivez votre message..." autocomplete="off" required />
            <button type="submit">
              <span>Envoyer</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
