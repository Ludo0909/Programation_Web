<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Supabase</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --primary: #007bff;
      --primary-text: #ffffff;
      --bubble-other: #e9ecef;
      --border: #dee2e6;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e0e0e0;
      --text-muted: #888888;
      --primary: #0d6efd;
      --primary-text: #ffffff;
      --bubble-other: #2d2d2d;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Barre latérale (Salons) */
    aside {
      width: 280px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .aside-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #form-channel {
      display: flex;
      padding: 0.75rem;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    #form-channel input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
    }

    #ul-channels {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.5rem;
    }

    .channel-item {
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.8rem;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
    }

    .channel-item:hover {
      background-color: var(--bg);
    }

    .channel-item[aria-current="true"] {
      background-color: var(--primary);
      color: var(--primary-text);
      font-weight: bold;
    }

    /* Zone de conversation */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #button-back {
      padding: 0.3rem 0.6rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
    }

    #span-channel-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    #div-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Style des bulles de messages */
    article {
      max-width: 65%;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      background-color: var(--bubble-other);
      align-self: flex-start;
      display: flex;
      flex-direction: column;
    }

    article.sent {
      align-self: flex-end;
      background-color: var(--primary);
      color: var(--primary-text);
    }

    article header {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    article.sent header {
      color: rgba(255, 255, 255, 0.85);
    }

    article p {
      font-size: 0.95rem;
      word-break: break-word;
    }

    article time {
      font-size: 0.65rem;
      color: var(--text-muted);
      align-self: flex-end;
      margin-top: 0.25rem;
    }

    article.sent time {
      color: rgba(255, 255, 255, 0.75);
    }

    /* Formulaire d'envoi */
    #form-message {
      display: flex;
      padding: 0.75rem;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      gap: 0.5rem;
    }

    #input-message {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    button {
      padding: 0.6rem 1rem;
      background-color: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #button-signout {
      background: transparent;
      color: #dc3545;
      border: 1px solid #dc3545;
      padding: 0.3rem 0.6rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-service.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <aside>
    <div class="aside-header">
      <h2>Salons</h2>
      <button id="button-signout">Quitter</button>
    </div>

    <form id="form-channel">
      <input type="text" id="input-channel" placeholder="Nom du salon..." required />
      <button type="submit">+</button>
    </form>

    <ul id="ul-channels"></ul>
  </aside>

  <main>
    <div class="chat-header">
      <button id="button-back">✕ Fermer</button>
      <span id="span-channel-title">Sélectionnez un salon</span>
    </div>

    <div id="div-messages"></div>

    <form id="form-message">
      <input type="text" id="input-message" placeholder="Écrire un message..." autocomplete="off" required />
      <button type="submit">Envoyer</button>
    </form>
  </main>

</body>
</html>
