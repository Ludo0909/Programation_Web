  <!-- Zone de contenu -->
  <main class="content">
    <header class="welcome-header">
      <h1>Vos Conversations</h1>
      <p>Échangez en direct avec vos camarades dans vos canaux de discussion.</p>
    </header>

    <div class="chat-hub-layout">
      <!-- Liste des salons -->
      <div class="chat-cards-list">
        <div class="chat-list-header">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0 fw-bold">Salons</h6>
            <button class="btn btn-sm btn-outline-warning text-dark fw-semibold" data-bs-toggle="modal" data-bs-target="#newChannelModal">
              + Créer
            </button>
          </div>
          <input type="text" id="search-channels" class="form-control form-control-sm" placeholder="Rechercher un salon...">
        </div>
        <div id="ul-channels" class="chat-list-scroll"></div>
      </div>

      <!-- Fenêtre de chat -->
      <div class="chat-window-card">
        <!-- Placeholder par défaut -->
        <div id="chat-placeholder">
          <div class="placeholder-icon-wrap">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <h5 class="fw-bold text-dark mb-1">Aucune conversation sélectionnée</h5>
          <p class="small text-muted">Choisissez un salon à gauche ou créez-en un nouveau.</p>
        </div>

        <!-- Conversation active -->
        <div id="chat-container" class="chat-main">
          <div class="chat-header">
            <div class="d-flex align-items-center gap-3">
              <div class="avatar" id="header-avatar">#</div>
              <div>
                <h5 class="mb-0 fw-bold" id="span-channel-title">Nom du salon</h5>
                <span class="status-online">● en direct</span>
              </div>
              <div class="chat-header-actions">
                <button id="btn-toggle-calendar" class="btn-cal-header" title="Calendrier du groupe">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                  <span>Calendrier</span>
                </button>
              </div>
            </div>
          </div>

          <div id="div-messages" class="messages-area"></div>

          <form id="form-message" class="chat-input-bar">
            <input type="text" id="input-message" placeholder="Écrivez votre message..." autocomplete="off" required />
            <button type="submit">
              <span>Envoyer</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
        <!-- Panneau latéral du calendrier dédié au salon -->
<div id="channel-calendar-panel" class="channel-cal-panel hidden">
  <div class="panel-header">
    <h3>Calendrier : <span id="cal-channel-name">--</span></h3>
    <button id="btn-close-channel-cal" class="btn-close-panel">&times;</button>
  </div>

  <div class="panel-calendar-controls">
    <button id="cal-panel-prev">&larr;</button>
    <span id="cal-panel-month">Mois Année</span>
    <button id="cal-panel-next">&rarr;</button>
  </div>

  <div class="mini-calendar-weekdays">
    <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
  </div>
  <div id="mini-calendar-days" class="mini-calendar-grid"></div>

  <!-- Formulaire d'ajout rapide pour ce salon -->
  <div class="panel-add-event">
    <h4>Ajouter pour le <span id="panel-selected-date-text">--</span></h4>
    <form id="panel-event-form">
      <input type="hidden" id="panel-selected-date">
      <input type="text" id="panel-event-title" placeholder="Ex: Rendu de groupe" required>
      <select id="panel-event-category">
        <option value="projet">Réunion / Projet (Vert)</option>
        <option value="occupe">Occupé / Pas dispo (Rouge)</option>
      </select>
      <div class="panel-time-row">
        <input type="time" id="panel-event-start" value="10:00" required>
        <input type="time" id="panel-event-end" value="11:00" required>
      </div>
      <button type="submit" class="btn-add-event">Enregistrer l'événement</button>
    </form>
  </div>
</div>
      </div>
    </div>
  </main>

  <!-- Modale de création de salon -->
  <div class="modal fade" id="newChannelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Créer un nouveau salon</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-channel">
          <div class="modal-body">
            <label for="input-channel" class="form-label small text-muted">Nom du canal (ex : Projet-Web, Général...)</label>
            <input type="text" id="input-channel" class="form-control" placeholder="Entrez le nom du salon..." required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-warning text-white fw-bold">Créer le salon</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
