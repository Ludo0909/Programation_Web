  <main class="content p-4">
    <header class="welcome-header mb-4">
      <h1>Vos Conversations</h1>
      <p>Sélectionnez un canal pour discuter en temps réel.</p>
    </header>

    <div class="chat-hub-layout">
      <div class="chat-cards-list">
        <form id="form-channel" class="d-flex gap-2 mb-2">
          <input type="text" id="input-channel" class="form-control form-control-sm" placeholder="Créer un salon..." required />
          <button type="submit" class="btn btn-primary btn-sm">+</button>
        </form>
        <div id="ul-channels" class="d-flex flex-column gap-2"></div>
      </div>
      <div class="chat-window-card">
        <div id="chat-placeholder" class="d-flex flex-column align-items-center justify-content-center h-100 text-muted">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <p class="mt-2">Sélectionnez une conversation à gauche</p>
        </div>
        <div id="chat-container" class="chat-main">
          
          <div class="chat-header">
            <div class="avatar" id="header-avatar">#</div>
            <div>
              <h3 id="span-channel-title">Nom du salon</h3>
              <span class="status-online">● en ligne</span>
            </div>
          </div>
          <div id="div-messages" class="messages-area"></div>
          <form id="form-message" class="chat-input-bar">
            <input type="text" id="input-message" placeholder="Votre message..." autocomplete="off" required />
            <button type="submit">Envoyer</button>
          </form>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
