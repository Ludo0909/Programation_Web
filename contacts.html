        <main class="content contacts-page" id="contacts-page" hidden>
            <header class="welcome-header">
    <h1>Annuaire des membres</h1>
    <p>Retrouvez tous les membres inscrits sur WorkFlow et démarrez une discussion en un clic.</p>
</header>

<div id="page-message" class="notice" role="status" aria-live="polite"></div>
<section class="panel" aria-labelledby="list-title">
    <div class="panel-head">
        <div>
            <h2 id="list-title">Utilisateurs enregistrés <span class="count" id="contact-count"></span></h2>
            <p class="panel-desc">Cliquez sur la bulle de message pour échanger en privé.</p>
        </div>
        <div class="field search-field">
            <label for="search-contacts" class="visually-hidden">Rechercher un membre</label>
            <input type="search" id="search-contacts" placeholder="Rechercher un membre...">
        </div>
    </div>

    <ul class="contact-list" id="contact-list"></ul>
    <p class="empty-state" id="empty-state" hidden></p>
</section>
